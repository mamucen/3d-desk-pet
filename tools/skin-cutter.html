<!DOCTYPE html>
<html>
<body>
<canvas id="c"></canvas>
<script>
// 从盲盒卡片里裁出「收藏卡」：以小人包围盒为中心取一个统一比例的竖卡，
// 背景和水印整体压暗（小人亮、背景暗，颜色距离可以分开），做成桌面上不突兀的深色卡片。
window.cutSkin = function (imgSrc) {
  return new Promise(function (resolve, reject) {
    const img = new Image();
    img.onload = function () { try { resolve(process(img)); } catch (e) { reject(e); } };
    img.onerror = function () { reject(new Error('img load fail')); };
    img.src = imgSrc;
  });

  function process(img) {
    const W = img.width, H = img.height;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    const px = ctx.getImageData(0, 0, W, H).data;

    // 背景基准：四角各 12x12 平均色
    let br = 0, bg = 0, bb = 0, bn = 0;
    const corners = [[0, 0], [W - 12, 0], [0, H - 12], [W - 12, H - 12]];
    for (const [cx, cy] of corners) {
      for (let y = cy; y < cy + 12; y++) for (let x = cx; x < cx + 12; x++) {
        const i = (y * W + x) * 4; br += px[i]; bg += px[i + 1]; bb += px[i + 2]; bn++;
      }
    }
    br /= bn; bg /= bn; bb /= bn;
    function dist(i) {
      const dr = px[i] - br, dg = px[i + 1] - bg, db = px[i + 2] - bb;
      return Math.sqrt(dr * dr + dg * dg + db * db);
    }

    // 小人包围盒（只看上半部：名字/稀有度在 y≈650 以后，二维码卡更靠下，都不能进来）
    let minX = W, minY = H, maxX = 0, maxY = 0;
    const BODY_T = 64;
    for (let y = 0; y < Math.min(H, 575); y++) {
      for (let x = 0; x < W; x++) {
        if (dist((y * W + x) * 4) > BODY_T) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX <= minX) throw new Error('找不到小人');
    const cx0 = (minX + maxX) / 2, cy0 = (minY + maxY) / 2;
    const bw = maxX - minX, bh = maxY - minY;

    // 统一比例的竖卡：小人占卡片高度约 78%，四周留出呼吸空间
    // 卡片高度封顶 600 —— 再高就会把下方的名字/稀有度文字裁进来
    const RATIO = 0.78;                       // 宽:高
    let ch = Math.min(600, bh * 1.26);
    let cw = ch * RATIO;
    if (cw < bw * 1.18) { cw = Math.min(W, bw * 1.18); ch = Math.min(600, cw / RATIO); }
    cw = Math.round(cw); ch = Math.round(ch);
    let x0 = Math.round(cx0 - cw / 2), y0 = Math.round(cy0 - ch / 2);
    x0 = Math.max(0, Math.min(W - cw, x0));
    y0 = Math.max(0, Math.min(580 - ch, y0));

    const c2 = document.createElement('canvas'); c2.width = cw; c2.height = ch;
    const ctx2 = c2.getContext('2d', { willReadFrequently: true });
    ctx2.drawImage(c, x0, y0, cw, ch, 0, 0, cw, ch);
    const img2 = ctx2.getImageData(0, 0, cw, ch);
    const q = img2.data;

    // 背景压暗：离背景色越近压得越狠（小人亮、背景暗），水印文字几乎融进卡片
    for (let p = 0; p < cw * ch; p++) {
      const i = p * 4;
      const d = dist(((y0 + ((p / cw) | 0)) * W + (x0 + (p % cw))) * 4);
      const t = Math.min(1, d / 40);          // 0=纯背景 1=小人
      const f = 0.34 + 0.66 * t * t;          // 平滑压暗曲线
      q[i] = Math.round(q[i] * f);
      q[i + 1] = Math.round(q[i + 1] * f);
      q[i + 2] = Math.round(q[i + 2] * f);
    }
    ctx2.putImageData(img2, 0, 0);
    return { dataUrl: c2.toDataURL('image/png'), w: cw, h: ch, box: [x0, y0, cw, ch] };
  }
};
</script>
</body>
</html>
