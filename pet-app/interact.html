<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>互动应用</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #121020; --line: rgba(139,124,255,.16);
    --text: #ece9ff; --dim: #9d97bd; --accent: #8b7cff; --mint: #5ee0c0;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% -10%, #241f45 0%, var(--bg) 55%, #0c0a16 100%);
    color: var(--text);
    font: 13px/1.5 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    overflow: hidden; user-select: none;
  }
  header { -webkit-app-region: drag; padding: 15px 18px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
  header .ttl { flex: 1; }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  header p { color: var(--dim); font-size: 11.5px; margin-top: 3px; }
  #close { -webkit-app-region: no-drag; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--dim); font-size: 13px; cursor: pointer; }
  #close:hover { color: #fff; background: rgba(255,90,120,.25); border-color: rgba(255,90,120,.4); }
  .master { display: flex; align-items: center; gap: 8px; -webkit-app-region: no-drag; }
  .master span { font-size: 11.5px; color: var(--dim); }

  .sw { position: relative; width: 36px; height: 20px; flex: none; cursor: pointer; }
  .sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .sw i { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.08); transition: background .18s; }
  .sw i::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; left: 2px; top: 2px; background: #cfc9ee; transition: transform .18s, background .18s; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .sw input:checked + i { background: linear-gradient(135deg, #7b68ff, #9d8cff); border-color: rgba(160,140,255,.7); }
  .sw input:checked + i::after { transform: translateX(16px); background: #fff; }

  .toolbar { display: flex; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .toolbar input {
    flex: 1; background: rgba(0,0,0,.3); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 7px 11px; font: inherit; font-size: 12px; outline: none;
  }
  .toolbar input:focus { border-color: rgba(139,124,255,.6); box-shadow: 0 0 0 2px rgba(139,124,255,.12); }
  .toolbar input::placeholder { color: #6f6a8c; }
  .toolbar button { flex: none; border: 1px solid var(--line); background: rgba(139,124,255,.14); color: var(--text); border-radius: 9px; padding: 0 13px; font: inherit; font-size: 12px; cursor: pointer; }
  .toolbar button:hover { background: rgba(139,124,255,.26); }

  main { height: calc(100% - 140px); overflow-y: auto; padding: 12px 16px 22px; }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: rgba(139,124,255,.25); border-radius: 8px; }

  .card { background: linear-gradient(180deg, rgba(34,30,58,.92), rgba(24,21,42,.92)); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin-bottom: 12px; }
  .card > h2 { font-size: 11.5px; font-weight: 600; letter-spacing: .8px; color: var(--dim); padding: 10px 13px 7px; display: flex; gap: 8px; align-items: center; }
  .card > h2 em { font-style: normal; color: var(--accent); font-size: 11px; }

  .row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; }
  .row:hover { background: rgba(139,124,255,.07); }
  .row + .row { border-top: 1px solid rgba(255,255,255,.04); }
  .nm { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; }
  .nm b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 999px; color: var(--mint); background: rgba(94,224,192,.12); border: 1px solid rgba(94,224,192,.25); flex: none; }
  .tag.sched { color: #ffcf6b; background: rgba(255,207,107,.1); border-color: rgba(255,207,107,.28); }
  .ctl { display: flex; align-items: center; gap: 6px; flex: none; }
  .lab { font-size: 10.5px; color: var(--dim); }
  .btn { border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--dim); font-size: 11px; padding: 3px 8px; border-radius: 8px; cursor: pointer; font-family: inherit; flex: none; }
  .btn:hover { color: var(--text); border-color: rgba(139,124,255,.5); background: rgba(139,124,255,.14); }
  .btn.go { color: #c9c2ff; border-color: rgba(139,124,255,.4); background: rgba(139,124,255,.14); }
  .btn.go:hover { background: rgba(139,124,255,.3); color: #fff; }
  .btn.del { border: 0; background: transparent; color: #7d7796; padding: 2px 6px; }
  .btn.del:hover { color: #ff7a92; background: rgba(255,90,120,.12); }
  input[type=time] {
    width: 74px; background: rgba(0,0,0,.3); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 2px 4px; font: inherit; font-size: 11px; outline: none;
  }
  input[type=time]::-webkit-calendar-picker-indicator { filter: invert(.7); cursor: pointer; }

  .empty { color: #6f6a8c; font-size: 11.5px; padding: 8px 13px 12px; }
  footer { padding: 0 18px 12px; color: #6f6a8c; font-size: 10.5px; line-height: 1.7; }
  footer b { color: #8a84a8; font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="ttl">
    <h1>互动应用</h1>
    <p id="sub">从本机开始菜单扫描出来的真实应用 · 只读窗口标题</p>
  </div>
  <div class="master">
    <span>总开关</span>
    <label class="sw"><input type="checkbox" id="master"><i></i></label>
  </div>
  <button id="close" title="关闭">✕</button>
</header>

<div class="toolbar">
  <input id="q" placeholder="搜索应用名…">
  <button id="addExe">添加程序…</button>
</div>

<main>
  <section class="card" id="liveCard" style="display:none">
    <h2>正在运行 <em id="liveCount"></em></h2>
    <div id="liveList"></div>
  </section>

  <section class="card">
    <h2>本机应用 <em id="appCount"></em></h2>
    <div id="appList"></div>
  </section>
</main>

<footer>
  <b>能做什么：</b>「打招呼」= 这个应用出现时它说句话；「定时」= 到点后它走过去把应用打开；「打开」= 现在就走过去开一次。<br>
  <b>不会做什么：</b>不截图窗口内容、不模拟点击、不发按键；只启动你自己勾选的快捷方式。<br>
  <b>防打扰：</b>同一个应用 8 分钟只招呼一次；定时任务跑在桌宠进程里，关掉桌宠就不执行。
</footer>

<script>
  var api = window.InteractHost;
  var state = { on: true, apps: [] };
  var main = document.querySelector('main');
  var q = document.getElementById('q');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function sw(id, on, field) {
    return '<label class="sw"><input type="checkbox" data-key="' + esc(id) + '" data-field="' + field + '"' +
      (on ? ' checked' : '') + '><i></i></label>';
  }

  function row(a) {
    return '<div class="row">' +
      '<div class="nm"><b>' + esc(a.name) + '</b>' +
        (a.running ? '<span class="tag">运行中</span>' : '') +
        (a.schedOn ? '<span class="tag sched">定时 ' + esc(a.time) + '</span>' : '') +
      '</div>' +
      '<div class="ctl">' +
        '<span class="lab">打招呼</span>' + sw(a.key, a.allow, 'allow') +
        '<span class="lab">定时</span>' + sw(a.key, a.schedOn, 'sched') +
        '<input type="time" data-key="' + esc(a.key) + '" value="' + esc(a.time) + '">' +
        '<button class="btn" data-try="' + esc(a.key) + '">试一下</button>' +
        '<button class="btn go" data-open="' + esc(a.key) + '">打开</button>' +
        (a.manual ? '<button class="btn del" data-del="' + esc(a.key) + '" title="移除">✕</button>' : '') +
      '</div>' +
    '</div>';
  }

  function render() {
    var keep = main.scrollTop;
    document.getElementById('master').checked = !!state.on;
    var apps = state.apps || [];
    document.getElementById('appCount').textContent = apps.length + ' 个';
    document.getElementById('sub').textContent =
      '从本机开始菜单扫描出来的真实应用 · 共 ' + apps.length + ' 个 · 正在运行 ' + apps.filter(function (a) { return a.running; }).length + ' 个';

    var running = apps.filter(function (a) { return a.running; });
    var liveCard = document.getElementById('liveCard');
    if (running.length) {
      liveCard.style.display = '';
      document.getElementById('liveCount').textContent = running.length + ' 个';
      document.getElementById('liveList').innerHTML = running.map(row).join('');
    } else {
      liveCard.style.display = 'none';
      document.getElementById('liveList').innerHTML = '';
    }

    var kw = (q.value || '').trim().toLowerCase();
    var list = kw ? apps.filter(function (a) { return a.name.toLowerCase().indexOf(kw) >= 0; }) : apps;
    document.getElementById('appList').innerHTML = list.length
      ? list.map(row).join('')
      : '<div class="empty">' + (kw ? '没有匹配「' + esc(kw) + '」的应用' : '没扫到应用，试试「添加程序…」') + '</div>';
    main.scrollTop = keep;
  }

  function apply(s) { if (!s) return; state = s; render(); }

  api.get().then(apply);
  api.onState(apply);

  document.getElementById('master').addEventListener('change', function (e) { api.setOn(e.target.checked); });
  q.addEventListener('input', render);
  document.getElementById('addExe').addEventListener('click', function () { api.addExe(); });
  document.getElementById('close').addEventListener('click', function () { api.close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') api.close(); });

  main.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || !t.dataset || !t.dataset.key) return;
    var patch = {};
    if (t.type === 'checkbox') patch[t.dataset.field] = t.checked;
    else if (t.type === 'time') patch.time = t.value;
    api.setApp(t.dataset.key, patch);
  });

  main.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.dataset) return;
    if (t.dataset.try) { api.test(t.dataset.try); return; }
    if (t.dataset.open) { api.open(t.dataset.open); return; }
    if (t.dataset.del) { api.del(t.dataset.del); }
  });
</script>
</body>
</html>
